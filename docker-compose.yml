services:
  db:
    image: postgres:16-alpine
    container_name: cronhub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       cronhub
      POSTGRES_USER:     cronhub
      POSTGRES_PASSWORD: cronhub_secret
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cronhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cronhub_backend
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      NODE_ENV:     production
      PORT:         3004
      DATABASE_URL: postgresql://cronhub:cronhub_secret@db:5432/cronhub
      DATABASE_SSL: "false"
      JWT_SECRET:   ${CRONHUB_JWT_SECRET:?Set CRONHUB_JWT_SECRET}
      SECRETS_ENCRYPTION_KEY: ${CRONHUB_ENCRYPTION_KEY:?Set CRONHUB_ENCRYPTION_KEY}
      FRONTEND_URL: http://localhost:5176
      APP_URL:      http://localhost:5176
      SMTP_HOST:    ${SMTP_HOST:-}
      SMTP_PORT:    ${SMTP_PORT:-587}
      SMTP_SECURE:  ${SMTP_SECURE:-false}
      SMTP_USER:    ${SMTP_USER:-}
      SMTP_PASS:    ${SMTP_PASS:-}
      SMTP_FROM:    ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
